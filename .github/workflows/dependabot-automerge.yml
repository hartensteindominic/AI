name: Auto-merge safe dependency updates

on:
  workflow_run:
    workflows: [GhostForge CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-automerge-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  merge:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Merge tested grouped minor and patch updates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          prs="$(gh api "/repos/${REPOSITORY}/commits/${HEAD_SHA}/pulls")"
          pr_number="$(jq -r '[.[] | select(.state == "open" and .user.login == "dependabot[bot]")] | first | .number // empty' <<<"${prs}")"

          if [ -z "${pr_number}" ]; then
            echo "No open Dependabot pull request is attached to ${HEAD_SHA}."
            exit 0
          fi

          title="$(gh pr view "${pr_number}" --repo "${REPOSITORY}" --json title --jq .title)"
          case "${title}" in
            *production-minor-and-patch*|*development-minor-and-patch*)
              echo "Merging tested safe dependency group: ${title}"
              ;;
            *)
              echo "Leaving non-grouped or major update for manual review: ${title}"
              exit 0
              ;;
          esac

          gh pr merge "${pr_number}" --repo "${REPOSITORY}" --squash --delete-branch
