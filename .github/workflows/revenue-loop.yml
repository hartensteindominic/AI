name: GhostForge revenue loop

on:
  push:
    branches: [main]
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ghostforge-revenue-loop
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Test ranking and safety filters
        run: npm test
      - name: Scan and refresh the revenue queue
        run: npm run scan:revenue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHOSTFORGE_OUTPUT_DIR: .ghostforge-output
          GHOSTFORGE_UPDATE_ISSUE: 'true'
      - name: Save full scan results
        uses: actions/upload-artifact@v4
        with:
          name: ghostforge-revenue-scan-${{ github.run_number }}
          path: .ghostforge-output/
          retention-days: 14
